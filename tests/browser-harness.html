<!doctype html><html lang="en"><meta charset="utf-8"><title>Campus release checks</title><style>body{margin:0;font:13px system-ui;background:#edf0e6}header{padding:10px;display:flex;gap:8px;flex-wrap:wrap}button{padding:8px}iframe{border:0;width:100%;height:calc(100vh - 155px)}#log{height:75px;overflow:auto;padding:10px;white-space:pre-wrap;margin:0}</style><header><button id="journey">Run complete walking journey</button><button id="storage">Denied storage</button><button id="webgl">No WebGL</button><button id="renderer">Renderer failure</button><button id="chunk">3D chunk failure</button><button id="normal">Normal reload</button><button id="loss">Lose WebGL context</button><button id="touch">Test touch joystick</button><button id="keyboard">Test keyboard + pause + reset</button><button id="view-library">View Fondren</button><button id="view-pavilion">View Brochstein</button><button id="view-college">View Duncan</button><button id="motion">Test motion lifecycle</button><button id="sallyport">Walk through Sallyport</button><button id="touch-lifecycle">Test touch cancel and run</button></header><pre id="log" role="status">Ready. Tests drive the exported app using DOM events; no position teleporting.</pre><iframe id="app" src="/campus" title="Portfolio under test"></iframe><script>
const frame=document.querySelector('iframe'),log=document.querySelector('#log');
const wait=ms=>new Promise(r=>setTimeout(r,ms));const out=s=>{log.textContent+='\n'+s;log.scrollTop=log.scrollHeight};const doc=()=>frame.contentDocument;const win=()=>frame.contentWindow;const getGame=()=>doc().querySelector('[data-testid=game]');const pos=()=>getGame().dataset.position.split(',').map(Number);const key=(k,type)=>getGame()?.dispatchEvent(new (win().KeyboardEvent)(type,{key:k,bubbles:true}));const up=()=>['w','a','s','d','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Shift'].forEach(k=>key(k,'keyup'));
const button=text=>[...doc().querySelectorAll('button')].find(b=>b.textContent.includes(text));const press=text=>{const b=button(text);if(!b)throw Error('Missing button '+text);b.click()};
async function loaded(){for(let i=0;i<200;i++){const b=button('Let’s take a walk');if(b&&!b.disabled)return;await wait(100)}throw Error('Loading timeout')}
async function start(){await loaded();press('Let’s take a walk');await wait(300);getGame().focus()}
async function travel(tx,tz){up();const [x,z]=pos();const route=await fetch(`/__qa/path?x=${x}&z=${z}&tx=${tx}&tz=${tz}`).then(r=>r.json());getGame().focus();for(const p of route.slice(1)){const begin=Date.now();while(true){if(doc().querySelector('dialog[open]')?.textContent.includes('A parliament of owls')){up();out('Reached final owl: completion pauses movement');return}const [px,pz]=pos(),dx=p.x-px,dz=p.z-pz;if(Math.hypot(dx,dz)<.4)break;if(Date.now()-begin>20000)throw Error(`Stuck at ${px},${pz}, target ${p.x},${p.z}`);up();const sx=dx-dz,sz=dx+dz;if(Math.abs(sx)>.35)key(sx>0?'d':'a','keydown');if(Math.abs(sz)>.35)key(sz>0?'s':'w','keydown');if(Math.hypot(dx,dz)<2){await wait(25);up();await wait(155)}else await wait(65)}up()}await wait(180);out(`Reached ${tx},${tz}: ${pos()}`)}
async function dialogCheck(name){getGame().focus();key('e','keydown');key('e','keyup');await wait(200);const d=doc().querySelector('dialog[open]');if(!d||!d.textContent.includes(name))throw Error('Expected exhibit '+name);const before=pos().join();key('w','keydown');await wait(220);up();if(pos().join()!==before)throw Error('Movement did not pause');d.querySelector('button').click();await wait(160);if(doc().querySelector('dialog[open]'))throw Error('Dialog did not close');out('PASS exhibit / pause / close: '+name)}
function run(fn){return async()=>{try{await fn();out('PASS test finished')}catch(e){up();out('FAIL '+e.message)}}}
document.querySelector('#journey').onclick=run(async()=>{localStorage.removeItem('michael-campus-owls-v1');frame.src='/campus';await wait(300);await start();for(const [x,z,name]of[[20,10,'Lovett Hall'],[20,-8,'Duncan Hall'],[37,-40,'Duncan College'],[-3,10,'Fondren Library'],[-30,18,'Brochstein Pavilion']]){await travel(x,z);await dialogCheck(name)}for(const [x,z]of[[8,21],[-32,-1],[32,-30]])await travel(x,z);await wait(500);const d=doc().querySelector('dialog[open]');if(!d?.textContent.includes('A parliament of owls'))throw Error('Completion dialog missing');out('PASS all three owls and completion');d.querySelector('button').click();frame.contentWindow.location.reload();await wait(400);await start();if(!doc().body.textContent.includes('3 / 3 owls discovered'))throw Error('Progress not restored');out('PASS reload persistence');press('Reset position');await wait(250);if(pos().join()!=='20,10')throw Error('Reset failed');out('PASS reset');frame.src='/campus';await wait(350);await loaded();frame.contentWindow.localStorage.removeItem('michael-campus-owls-v1');frame.contentWindow.location.reload();await wait(350);await start();for(const [x,z] of [[8,21],[-32,-1],[32,-30]])await travel(x,z);await wait(250);press('Restart the owl hunt');await wait(250);if(!doc().body.textContent.includes('0 / 3 owls discovered')||pos().join()!=='20,10'||frame.contentWindow.localStorage.getItem('michael-campus-owls-v1')!==null)throw Error('Hunt restart failed');out('PASS restart clears owls and storage, restores spawn');});
for(const fault of ['storage','webgl','renderer','chunk'])document.querySelector('#'+fault).onclick=()=>{frame.src='/campus?fault='+fault;out('Loaded fault: '+fault)};
document.querySelector('#normal').onclick=()=>frame.src='/campus';
document.querySelector('#loss').onclick=()=>{const c=doc().querySelector('canvas');c.getContext('webgl2').getExtension('WEBGL_lose_context').loseContext();out('Context loss requested')};
document.querySelector('#keyboard').onclick=run(async()=>{if(button('Let’s take a walk'))await start();press('Reset position');await wait(250);getGame().focus();const p=pos().join();key('w','keydown');await wait(450);up();await wait(200);if(pos().join()===p)throw Error('W did not move');out('PASS WASD');key('ArrowRight','keydown');await wait(450);up();await wait(200);if(pos().join()===p)throw Error('Arrows did not move');out('PASS arrows');press('Reset position');await wait(250);await dialogCheck('Lovett Hall');});
document.querySelector('#touch').onclick=run(async()=>{if(button('Let’s take a walk'))await start();press('Reset position');await wait(250);const j=doc().querySelector('.joystick'),r=j.getBoundingClientRect();if(!r.width)throw Error('Use a mobile viewport');const before=pos().join();const send=(type,x)=>j.dispatchEvent(new (win().PointerEvent)(type,{pointerId:1,pointerType:'touch',clientX:x,clientY:r.y+r.height/2,bubbles:true}));send('pointerdown',r.x+r.width/2);send('pointermove',r.x+r.width-5);await wait(600);send('pointerup',r.x+r.width-5);await wait(250);if(pos().join()===before)throw Error('Joystick did not move');const stopped=pos().join();await wait(400);if(pos().join()!==stopped)throw Error('Joystick stuck after release');out('PASS joystick move and release');press('Reset position');await wait(250);press('Interact');await wait(200);if(!doc().querySelector('dialog[open]'))throw Error('Touch Interact failed');out('PASS touch Interact');doc().querySelector('dialog button').click()});

document.querySelector('#storage').onclick=run(async()=>{frame.src='/campus?fault=storage';await wait(350);await start();await travel(8,21);if(!doc().body.textContent.includes('1 / 3 owls discovered'))throw Error('Collecting with denied storage failed');doc().querySelector('[aria-label="Controls and information"]').click();await wait(250);if(!doc().body.textContent.includes('Storage is unavailable'))throw Error('Missing storage fallback notice');out('PASS denied storage: start, walk, collect, read/write recovery');});
for(const [id,x,z] of [['library',-3,10],['pavilion',-30,18],['college',37,-40]])document.querySelector('#view-'+id).onclick=run(async()=>{if(button('Let’s take a walk'))await start();await travel(x,z)});

document.querySelector('#motion').onclick=run(async()=>{
 if(button('Let’s take a walk'))await start();
 const speed=()=>Number(getGame().dataset.speed);
 press('Reset position');await wait(250);getGame().focus();key('w','keydown');await wait(95);const early=speed();await wait(500);const walk=speed();key('w','keyup');await wait(85);const brake=speed();await wait(600);if(!(early>0&&early<walk&&brake<walk&&speed()===0))throw Error(`Acceleration/brake ${early},${walk},${brake},${speed()}`);out(`PASS acceleration/brake: ${early}, ${walk}, ${brake}, ${speed()}`);
 press('Reset position');await wait(200);getGame().focus();key('Shift','keydown');key('w','keydown');await wait(500);const runSpeed=speed();up();if(runSpeed<walk*1.5)throw Error('Shift did not run: '+runSpeed+' vs walk '+walk);out(`PASS Shift: walk ${walk}, run ${runSpeed}`);
 for(const event of ['blur','resize','visibilitychange']){press('Reset position');await wait(180);getGame().focus();key('w','keydown');await wait(180);(event==='visibilitychange'?doc():win()).dispatchEvent(new (win().Event)(event));await wait(200);const p=pos().join();await wait(300);if(pos().join()!==p||speed()!==0)throw Error(event+' stuck input');out('PASS clears input on '+event);up();}
 press('Reset position');await wait(200);getGame().focus();key('w','keydown');await wait(150);key('e','keydown');key('e','keyup');await wait(220);if(!doc().querySelector('dialog[open]'))throw Error('Panel failed');const p=pos().join();await wait(200);if(pos().join()!==p)throw Error('Panel drift');doc().querySelector('dialog button').click();await wait(200);key('d','keydown');await wait(220);up();if(pos().join()===p)throw Error('No movement after panel');out('PASS panel pause and resume');
 press('Reset position');await wait(200);if(pos().join()!=='20,10'||speed()!==0)throw Error('Reset drift');out('PASS reset clears velocity');
 const mute=doc().querySelector('[aria-label="Mute footsteps"]');if(mute)mute.click();await wait(150);if(!doc().querySelector('[aria-label="Unmute footsteps"]'))throw Error('Mute unavailable');out('PASS mute control');
});
document.querySelector('#sallyport').onclick=run(async()=>{if(button('Let’s take a walk'))await start();press('Reset position');await wait(200);await travel(28,10);out('PASS Sallyport center reached');});

document.querySelector('#touch-lifecycle').onclick=run(async()=>{
 if(button('Let’s take a walk'))await start();press('Reset position');await wait(200);
 const j=doc().querySelector('.joystick'),r=j.getBoundingClientRect();if(!r.width)throw Error('Use mobile viewport');
 const send=(type,x)=>j.dispatchEvent(new (win().PointerEvent)(type,{pointerId:2,pointerType:'touch',clientX:x,clientY:r.y+r.height/2,bubbles:true}));
 for(const event of ['pointercancel','lostpointercapture']){send('pointerdown',r.x+r.width/2);send('pointermove',r.x+r.width-5);await wait(180);send(event,r.x+r.width-5);await wait(200);const p=pos().join();await wait(250);if(pos().join()!==p||Number(getGame().dataset.speed)!==0)throw Error(event+' drift');out('PASS '+event);press('Reset position');await wait(180);}
 press('Run');await wait(100);send('pointerdown',r.x+r.width/2);send('pointermove',r.x+r.width-5);await wait(500);if(Number(getGame().dataset.speed)<12)throw Error('Touch run too slow');out('PASS touch run');press('Reset position');await wait(200);if(pos().join()!=='20,10'||doc().querySelector('.touch-run').getAttribute('aria-pressed')!=='false')throw Error('Touch reset');out('PASS reset cancels active pointer and run');
 send('pointerdown',r.x+r.width/2);send('pointermove',r.x+r.width-5);await wait(150);doc().querySelector('[aria-label="Portfolio"]').click();await wait(200);const p=pos().join();await wait(250);if(pos().join()!==p)throw Error('Touch panel drift');doc().querySelector('dialog button').click();await wait(200);send('pointerdown',r.x+r.width/2);send('pointermove',r.x+r.width-5);await wait(200);send('pointerup',r.x+r.width-5);if(pos().join()===p)throw Error('Touch did not recover');out('PASS touch panel and new pointer recovery');
});
</script></html>
